title: Gabriel Jones
description: Web developer, grafico ed educatore. Creatore di Playbook, schede gioco per educatori e animatori.
url: "https://TUO-SITO.netlify.app"   # sostituisci con il dominio definitivo
lang: it
timezone: Europe/Rome
plugins: [jekyll-sitemap, jekyll-feed]
collections:
  news:      { output: false, sort_by: date }
  portfolio: { output: false }
  documents: { output: true, permalink: /documenti/:name/ }
  guides:    { output: true, permalink: /guide/:path/ }
defaults:
  - scope: { path: "", type: documents }
    values: { layout: document }
  - scope: { path: "", type: guides }
    values: { layout: guide }
exclude: [README.md, Gemfile, Gemfile.lock, netlify, netlify.toml, node_modules, vendor]

